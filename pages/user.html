<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Dashboard</title>

<link rel="stylesheet" href="../css/styles.css">

<style>

body{
background:#020f2c;
color:white;
font-family:'Segoe UI',sans-serif;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.logout{
background:#D13438;
border:none;
color:white;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#0d1b3d;
padding:20px;
border-radius:15px;
}

.card-title{
font-size:14px;
color:#9CA3AF;
margin-bottom:8px;
}

.card-value{
font-size:34px;
font-weight:bold;
}

.breaks{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
margin-bottom:30px;
}

.break-card{
background:#0d1b3d;
padding:20px;
border-radius:15px;
}

.break-card h3{
margin-bottom:15px;
}

.progress{
height:18px;
background:#1E293B;
border-radius:20px;
overflow:hidden;
margin-top:15px;
margin-bottom:15px;
}

.fill{
height:100%;
transition:.3s;
}

.green{
background:#22c55e;
}

.blue{
background:#3b82f6;
}

.orange{
background:#f59e0b;
}

.start-btn{
background:#107C10;
border:none;
color:white;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
}

.history{
background:#0d1b3d;
padding:20px;
border-radius:15px;
}

.history-item{
padding:12px;
background:#132044;
margin-top:10px;
border-radius:10px;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.modal-box{
background:#111827;
padding:30px;
width:420px;
border-radius:20px;
text-align:center;
}

.timer{
font-size:60px;
font-weight:bold;
margin:20px 0;
}

.stop-btn{
background:#D13438;
color:white;
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.notice{
margin-top:15px;
color:#60A5FA;
}

</style>
</head>

<body>

<div class="header">

<div>
<h1>User Dashboard</h1>
<h2 id="welcome"></h2>
</div>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

<div class="cards">

<div class="card">
<div class="card-title">
Status
</div>
<div class="card-value" id="statusBox">
Available
</div>
</div>

<div class="card">
<div class="card-title">
Total Remaining
</div>
<div class="card-value" id="remainingTotal">
60:00
</div>
</div>

<div class="card">
<div class="card-title">
Sessions Today
</div>
<div class="card-value" id="sessionCount">
0
</div>
</div>

</div>

<div class="breaks">

<div class="break-card">

<h3>☕ Break 1</h3>

<div style="font-size:32px;font-weight:bold"
id="break1Time">
15:00
</div>

<div class="progress">
<div id="break1Bar"
class="fill green"
style="width:100%">
</div>
</div>

<button
class="start-btn"
onclick="startBreak('break1')">
Start Break 1
</button>

</div>

<div class="break-card">

<h3>☕ Break 2</h3>

<div style="font-size:32px;font-weight:bold"
id="break2Time">
15:00
</div>

<div class="progress">
<div id="break2Bar"
class="fill blue"
style="width:100%">
</div>
</div>

<button
class="start-btn"
onclick="startBreak('break2')">
Start Break 2
</button>

</div>

<div class="break-card">

<h3>🍴 Lunch</h3>

<div style="font-size:32px;font-weight:bold"
id="lunchTime">
30:00
</div>

<div class="progress">
<div id="lunchBar"
class="fill orange"
style="width:100%">
</div>
</div>

<button
class="start-btn"
onclick="startBreak('lunch')">
Start Lunch
</button>

</div>

</div>

<div class="history">

<h2>Today's History</h2>

<div id="historyList">

<div class="history-item">
No history yet
</div>

</div>

</div>

<div class="modal" id="modal">

<div class="modal-box">

<h2 id="activeType">
Break Active
</h2>

<div class="timer"
id="liveTimer">
00:00
</div>

<div id="remainingDisplay">
Remaining: 15:00
</div>

<div class="notice">
Break time is being deducted live.
</div>

<br>

<button
class="stop-btn"
onclick="stopBreak()">
Stop Break
</button>

</div>

</div>

<script>

const user=
localStorage.getItem("currentUser");

document.getElementById("welcome")
.innerText="Welcome "+user;

let data=
JSON.parse(
localStorage.getItem(
"userData_"+user
)
);

if(!data){

data={
break1:900,
break2:900,
lunch:1800,
history:[]
};

saveData();

}

function saveData(){

localStorage.setItem(
"userData_"+user,
JSON.stringify(data)
);

}

function format(sec){

const m=
Math.floor(sec/60);

const s=
sec%60;

return `${m}:${String(s).padStart(2,'0')}`;

}

let activeBreak=null;
let interval=null;

function startBreak(type){

if(activeBreak){
alert(
"A break is already running."
);
return;
}

activeBreak={
type:type,
start:Date.now()
};

document.getElementById("modal")
.style.display="flex";

document.getElementById("activeType")
.innerText=
type.toUpperCase();

interval=setInterval(()=>{

const elapsed=
Math.floor(
(Date.now()-activeBreak.start)/1000
);

document.getElementById(
"liveTimer"
).innerText=
format(elapsed);

let remaining=
remainingFor(type)-elapsed;

remaining=Math.max(
remaining,
0
);

document.getElementById(
"remainingDisplay"
).innerText=
"Remaining: "+
format(remaining);

},1000);

document.getElementById(
"statusBox"
).innerText=
"On Break";

}

function remainingFor(type){

if(type==="break1") return data.break1;
if(type==="break2") return data.break2;
if(type==="lunch") return data.lunch;

return 0;

}

function stopBreak(){

clearInterval(interval);

const used=
Math.floor(
(Date.now()-activeBreak.start)/1000
);

if(activeBreak.type==="break1"){
data.break1=
Math.max(
0,
data.break1-used
);
}

if(activeBreak.type==="break2"){
data.break2=
Math.max(
0,
data.break2-used
);
}

if(activeBreak.type==="lunch"){
data.lunch=
Math.max(
0,
data.lunch-used
);
}

data.history.unshift({
type:activeBreak.type,
used:format(used),
time:new Date()
.toLocaleTimeString()
});

saveData();

document.getElementById("modal")
.style.display="none";

document.getElementById(
"statusBox"
).innerText=
"Available";

activeBreak=null;

render();

}

function render(){

document.getElementById(
"break1Time"
).innerText=
format(data.break1);

document.getElementById(
"break2Time"
).innerText=
format(data.break2);

document.getElementById(
"lunchTime"
).innerText=
format(data.lunch);

const total=
data.break1+
data.break2+
data.lunch;

document.getElementById(
"remainingTotal"
).innerText=
format(total);

document.getElementById(
"sessionCount"
).innerText=
data.history.length;

document.getElementById(
"break1Bar"
).style.width=
(data.break1/900*100)+"%";

document.getElementById(
"break2Bar"
).style.width=
(data.break2/900*100)+"%";

document.getElementById(
"lunchBar"
).style.width=
(data.lunch/1800*100)+"%";

const history=
document.getElementById(
"historyList"
);

if(
data.history.length===0
){

history.innerHTML=
'<div class="history-item">No history yet</div>';

}
else{

history.innerHTML='';

data.history.forEach(item=>{

history.innerHTML += `
<div class="history-item">
<strong>${item.type}</strong>
<br>
Used: ${item.used}
<br>
${item.time}
</div>
`;

});

}

}

function logout(){

localStorage.removeItem(
"currentUser"
);

window.location.href=
"../index.html";

}

render();

</script>

</body>
</html>
