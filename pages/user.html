<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Dashboard</title>

<link rel="stylesheet" href="../css/styles.css">

<style>

.dashboard-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.logout-btn{
background:#D13438;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#111827;
padding:20px;
border-radius:15px;
}

.card-title{
font-size:14px;
color:#94A3B8;
margin-bottom:10px;
}

.card-value{
font-size:32px;
font-weight:bold;
}

.break-card{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

.break-card h3{
margin-bottom:10px;
}

.start-btn{
background:#107C10;
border:none;
color:white;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
}

.progress{
width:100%;
height:20px;
background:#1E293B;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.progress-fill{
height:100%;
background:#0078D4;
width:0%;
}

.history{
background:#111827;
padding:20px;
border-radius:15px;
}

.history-entry{
margin-top:10px;
padding:10px;
background:#1E293B;
border-radius:8px;
}

</style>

</head>

<body>

<div class="dashboard-header">

<div>

<h1>User Dashboard</h1>

<h2 id="welcomeUser"></h2>

</div>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

<div class="cards">

<div class="card">

<div class="card-title">
Shift Progress
</div>

<div id="shiftPercentage" class="card-value">
0%
</div>

<div class="progress">

<div
id="shiftBar"
class="progress-fill">
</div>

</div>

<p id="shiftRemaining"
style="margin-top:10px;">
Loading...
</p>

</div>

<div class="card">

<div class="card-title">
Remaining Break Time
</div>

<div class="card-value">
60 mins
</div>

</div>

<div class="card">

<div class="card-title">
Status
</div>

<div id="statusText"
class="card-value">
Available
</div>

</div>

</div>

<div class="break-card">

<h3>☕ Break 1</h3>
