<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workday Break Dashboard</title>
 
<style>
 
:root{
--bg:#0b1220;
--card:#111827;
--border:#233045;
--primary:#0078D4;
--success:#107C10;
--warning:#FFB900;
--danger:#D13438;
--text:#F8FAFC;
--muted:#94A3B8;
}
 
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}
 
body{
background:var(--bg);
color:var(--text);
padding:20px;
}
 
.container{
max-width:1400px;
margin:auto;
}
 
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}
 
.clock{
font-size:24px;
font-weight:bold;
color:#60A5FA;
}
 
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-bottom:20px;
}
 
.card{
background:var(--card);
padding:20px;
border-radius:16px;
border:1px solid var(--border);
}
 
.card-label{
font-size:14px;
color:var(--muted);
margin-bottom:8px;
}
 
.card-value{
font-size:30px;
font-weight:bold;
}
 
.break-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-bottom:20px;
}
 
.break-card{
background:var(--card);
padding:20px;
border-radius:16px;
border:1px solid var(--border);
}
 
.break-card h2{
margin-bottom:15px;
}
 
.remaining{
font-size:40px;
font-weight:bold;
margin-bottom:15px;
}
 
.progress{
height:18px;
background:#1E293B;
border-radius:999px;
overflow:hidden;
}
 
.fill{
height:100%;
transition:.5s;
}
 
.green{
background:#107C10;
}
 
.blue{
background:#0078D4;
}
 
.orange{
background:#FFB900;
}
 
button{
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin-top:15px;
}
 
.start-btn{
background:#107C10;
color:white;
}
 
.reset-btn{
background:#D13438;
color:white;
}
 
.history{
background:var(--card);
padding:20px;
border-radius:16px;
border:1px solid var(--border);
}
 
table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}
 
th,td{
padding:12px;
text-align:left;
border-bottom:1px solid #233045;
}
 
th{
color:#93C5FD;
}
 
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}
 
.modal-box{
background:#111827;
padding:30px;
border-radius:20px;
width:400px;
text-align:center;
border:1px solid #233045;
}
 
.large-timer{
font-size:70px;
font-weight:bold;
margin:20px 0;
}
 
.stop-btn{
background:#D13438;
color:white;
}
 
.summary{
margin-top:15px;
padding:15px;
background:#13263d;
border-radius:10px;
display:none;
}
 
</style>
</head>
<body>
 
<div class="container">
 
<div class="header">
<h1>📊 Workday Break Dashboard</h1>
<div id="clock" class="clock"></div>
</div>
 
<div class="cards">
 
<div class="card">
<div class="card-label">Total Remaining Today</div>
<div class="card-value" id="totalRemaining">
60:00
</div>
</div>
 
<div class="card">
<div class="card-label">Break Sessions</div>
<div class="card-value" id="sessionCount">
0
</div>
</div>
 
<div class="card">
<div class="card-label">Current Status</div>
<div class="card-value" id="status">
Ready
</div>
</div>
 
</div>
 
<div class="break-grid">
 
<div class="break-card">
 
<h2>☕ Break 1</h2>
 
<div class="remaining" id="break1Text">
15:00
</div>
 
<div class="progress">
<div class="fill green"
id="break1Bar">
</div>
</div>
 
<button class="start-btn"
onclick="startBreak('Break 1')">
Start Break 1
</button>
 
</div>
 
<div class="break-card">
 
<h2>☕ Break 2</h2>
 
<div class="remaining" id="break2Text">
15:00
</div>
 
<div class="progress">
<div class="fill blue"
id="break2Bar">
</div>
</div>
 
<button class="start-btn"
onclick="startBreak('Break 2')">
Start Break 2
</button>
 
</div>
 
<div class="break-card">
 
<h2>🍴 Lunch</h2>
 
<div class="remaining" id="lunchText">
30:00
</div>
 
<div class="progress">
<div class="fill orange"
id="lunchBar">
</div>
</div>
 
<button class="start-btn"
onclick="startBreak('Lunch')">
Start Lunch
</button>
 
</div>
 
</div>
 
<button class="reset-btn"
onclick="resetDay()">
Reset Entire Day
</button>
 
<br><br>
 
<div class="history">
 
<h2>Today's History</h2>
 
<table>
 
<thead>
<tr>
<th>Start</th>
<th>End</th>
<th>Type</th>
<th>Used</th>
<th>Remaining After</th>
</tr>
</thead>
 
<tbody id="historyTable">
</tbody>
 
</table>
 
</div>
 
</div>
 
<div class="modal" id="breakModal">
 
<div class="modal-box">
 
<h2 id="modalTitle">
Break Active
</h2>
 
<div class="large-timer"
id="liveTimer">
00:00
</div>
 
<p>
Current Session Usage
</p>
 
<button
class="stop-btn"
onclick="stopBreak()">
Stop Break
</button>
 
<div class="summary"
id="summaryBox">
</div>
 
</div>
 
</div>
 
<script>
 
const STORAGE="WORKDAY_BREAKS_V3";
 
let state=
JSON.parse(
localStorage.getItem(STORAGE)
) || {
break1:900,
break2:900,
lunch:1800,
history:[]
};
 
let activeBreak=null;
let timer=null;
 
function save(){
localStorage.setItem(
STORAGE,
JSON.stringify(state)
);
}
 
function formatTime(sec){
 
let m=Math.floor(sec/60);
let s=sec%60;
 
return `${m}:${String(s).padStart(2,'0')}`;
 
}
 
function updateClock(){
 
document.getElementById("clock")
.innerText=
new Date().toLocaleTimeString();
 
}
 
setInterval(updateClock,1000);
updateClock();
 
function getRemaining(name){
 
if(name==="Break 1") return state.break1;
if(name==="Break 2") return state.break2;
if(name==="Lunch") return state.lunch;
 
}
 
function startBreak(name){
 
if(activeBreak){
alert("Another break is already running.");
return;
}
 
if(getRemaining(name)<=0){
alert("No allowance remaining.");
return;
}
 
activeBreak={
name:name,
start:Date.now()
};
 
document.getElementById("modalTitle")
.innerText=name;
 
document.getElementById("breakModal")
.style.display="flex";
 
timer=setInterval(()=>{
 
const used=
Math.floor(
(Date.now()-activeBreak.start)/1000
);
 
document.getElementById("liveTimer")
.innerText=
formatTime(used);
 
},1000);
 
document.getElementById("status")
.innerText=name+" Running";
 
}
 
function stopBreak(){
 
if(!activeBreak) return;
 
clearInterval(timer);
 
const used=
Math.floor(
(Date.now()-activeBreak.start)/1000
);
 
const startTime=
new Date(activeBreak.start)
.toLocaleTimeString();
 
const endTime=
new Date().toLocaleTimeString();
 
if(activeBreak.name==="Break 1"){
state.break1=
Math.max(0,state.break1-used);
}
 
if(activeBreak.name==="Break 2"){
state.break2=
Math.max(0,state.break2-used);
}
 
if(activeBreak.name==="Lunch"){
state.lunch=
Math.max(0,state.lunch-used);
}
 
const remaining=
getRemaining(activeBreak.name);
 
state.history.push({
start:startTime,
end:endTime,
type:activeBreak.name,
used:formatTime(used),
remaining:formatTime(remaining)
});
 
save();
 
document.getElementById("summaryBox")
.style.display="block";
 
document.getElementById("summaryBox")
.innerHTML=
`
✅ Break Recorded<br><br>
Used: <strong>${formatTime(used)}</strong><br>
Remaining: <strong>${formatTime(remaining)}</strong>
`;
 
setTimeout(()=>{
 
document.getElementById("breakModal")
.style.display="none";
 
document.getElementById("summaryBox")
.style.display="none";
 
},2500);
 
activeBreak=null;
 
document.getElementById("status")
.innerText="Ready";
 
render();
 
}
 
function render(){
 
document.getElementById("break1Text")
.innerText=formatTime(state.break1);
 
document.getElementById("break2Text")
.innerText=formatTime(state.break2);
 
document.getElementById("lunchText")
.innerText=formatTime(state.lunch);
 
const total=
state.break1+
state.break2+
state.lunch;
 
document.getElementById("totalRemaining")
.innerText=
formatTime(total);
 
document.getElementById("sessionCount")
.innerText=
state.history.length;
 
document.getElementById("break1Bar")
.style.width=
(state.break1/900*100)+"%";
 
document.getElementById("break2Bar")
.style.width=
(state.break2/900*100)+"%";
 
document.getElementById("lunchBar")
.style.width=
(state.lunch/1800*100)+"%";
 
const table=
document.getElementById("historyTable");
 
table.innerHTML="";
 
state.history
.slice()
.reverse()
.forEach(item=>{
 
table.innerHTML+=`
<tr>
<td>${item.start}</td>
<td>${item.end}</td>
<td>${item.type}</td>
<td>${item.used}</td>
<td>${item.remaining}</td>
</tr>
`;
 
});
 
}
 
function resetDay(){
 
if(
confirm(
"Reset all allowances and clear history?"
)
){
 
state={
break1:900,
break2:900,
lunch:1800,
history:[]
};
 
save();
render();
 
}
 
}
 
render();
 
</script>
 
</body>
</html>
